name: release

on:
  push:
    tags: ['release-*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: d79bfb002882b75dd8d2255873d3e5e2dc938f4a
  NDK_VERSION: 28.2.13676358

jobs:
  ffmpeg:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: android-armeabi-v7a, runner: ubuntu-24.04 }
          - { slug: android-arm64-v8a, runner: ubuntu-24.04 }
          - { slug: android-x86, runner: ubuntu-24.04 }
          - { slug: android-x86_64, runner: ubuntu-24.04 }
          - { slug: windows-x86_64, runner: windows-2022 }
          - { slug: macos-arm64, runner: macos-14 }
          - { slug: macos-x86_64, runner: macos-15-intel }
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}${{ startsWith(matrix.slug, 'android-') && format('-ndk{0}', env.NDK_VERSION) || '' }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'android-')
        name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'android-')
        working-directory: ffmpeg-build
        run: |
          sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
          scripts/build-android.sh "${SLUG#android-}"
        env:
          SLUG: ${{ matrix.slug }}

      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'windows-')
        name: Build Windows ffmpeg
        working-directory: ffmpeg-build
        shell: bash
        run: |
          bash ./scripts/build-desktop.sh

      - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'macos-')
        working-directory: ffmpeg-build
        run: |
          brew install nasm automake autoconf libtool pkg-config meson ninja
          scripts/build-desktop.sh

  android:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    env:
      SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: YMusicV4

      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-armeabi-v7a
          key: ffmpeg-android-armeabi-v7a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-arm64-v8a
          key: ffmpeg-android-arm64-v8a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-x86
          key: ffmpeg-android-x86-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-x86_64
          key: ffmpeg-android-x86_64-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Restore secrets
        if: env.SECRETS_PASSPHRASE != ''
        working-directory: YMusicV4
        run: ./decrypt.sh

      - name: Assemble release APKs
        working-directory: YMusicV4
        run: ./gradlew -Pproduction=true :androidApp:assembleRelease :engine-js:closureJs :engine-js:closurePlayerJs

      - name: Discard secrets
        if: always()
        working-directory: YMusicV4
        run: rm -rf secrets.properties signing

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: YMusicV4/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    needs: ffmpeg
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: YMusicV4

      - name: Restore ffmpeg windows cache
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/windows-x86_64
          key: ffmpeg-windows-x86_64-${{ env.FFMPEG_BUILD_REF }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore secrets
        if: env.SECRETS_PASSPHRASE != ''
        working-directory: YMusicV4
        run: ./decrypt.sh

      - name: Package Windows MSI
        working-directory: YMusicV4
        shell: powershell
        run: .\gradlew.bat -Pproduction=true :desktopApp:packageReleaseMsi

      - name: Discard secrets
        if: always()
        working-directory: YMusicV4
        run: Remove-Item -Recurse -Force secrets.properties, signing -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: YMusicV4/desktopApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  macos:
    name: macos ${{ matrix.slug }}
    needs: ffmpeg
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: macos-arm64, runner: macos-14 }
          - { slug: macos-x86_64, runner: macos-15-intel }

    steps:
      - uses: actions/checkout@v4
        with:
          path: YMusicV4

      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore secrets
        if: env.SECRETS_PASSPHRASE != ''
        working-directory: YMusicV4
        run: ./decrypt.sh

      - name: Package DMG
        working-directory: YMusicV4
        run: |
          if [ -z "$YMUSIC_MAC_IDENTITY" ] || ! grep -q '^mac.notarization.appleId=.' secrets.properties 2>/dev/null; then
            ./gradlew -Pproduction=true :desktopApp:packageReleaseDmg
            exit 0
          fi
          ./gradlew -Pproduction=true :desktopApp:packageReleaseDmg :desktopApp:notarizeReleaseDmg && exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-dmg
          path: YMusicV4/desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  test:
    needs: ffmpeg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: YMusicV4

      - uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/macos-arm64
          key: ffmpeg-macos-arm64-${{ env.FFMPEG_BUILD_REF }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - working-directory: YMusicV4
        run: >-
          ./gradlew --continue -Pci=true
          :commonUi:jvmTest
          :desktopApp:jvmTest
          :download:jvmTest
          :dynamic-engine:jvmTest
          :image-loader:jvmTest
          :kmpCommon:jvmTest
          :kmpFfmpeg:jvmTest
          :kmpHttp:core:jvmTest
          :kmpHttp:json:jvmTest
          :media-scanner:jvmTest
          :media-store:jvmTest
          :player:jvmTest
          :projectCommon:jvmTest
          :quickjs:jvmTest
          :remote-config:jvmTest
          :settings:jvmTest
          :telemetry:jvmTest
          :yt-media:jvmTest

  release:
    needs: [android, windows, macos, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: YMusicV4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the files
        run: |
          set -euo pipefail
          mkdir -p release
          one() { set -- $1; [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected one file for: $*" >&2; exit 1; }; echo "$1"; }
          cp "$(one 'artifacts/android-apks/*-armeabi-v7a-release.apk')" release/android-armv7.apk
          cp "$(one 'artifacts/android-apks/*-arm64-v8a-release.apk')" release/android-arm64.apk
          cp "$(one 'artifacts/android-apks/*-x86-release.apk')" release/android-x86.apk
          cp "$(one 'artifacts/android-apks/*-x86_64-release.apk')" release/android-x86_64.apk
          cp "$(one 'artifacts/windows-msi/*.msi')" release/windows-x64.msi
          cp "$(one 'artifacts/macos-arm64-dmg/*.dmg')" release/macos-arm64.dmg
          cp "$(one 'artifacts/macos-x86_64-dmg/*.dmg')" release/macos-intel.dmg
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "$TAG" --notes-file <(printf '%s\n' "Release build for $TAG") \
            --verify-tag
