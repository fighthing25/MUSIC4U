name: Build YMusic PC (MSI + EXE + Portable) - FIXED V4

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout YMusic
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MSYS2 with full build deps
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            yasm
            nasm
            mingw-w64-x86_64-autotools

      - name: Clone ffmpeg-build
        shell: bash
        run: |
          cd ..
          rm -rf ffmpeg-build
          git clone --recursive --shallow-submodules https://github.com/ymusic-io/ffmpeg-build ffmpeg-build

      - name: Build FFmpeg desktop
        shell: msys2 {0}
        run: |
          cd ../ffmpeg-build
          echo "autoreconf version:"
          autoreconf --version || echo "autoreconf not in PATH, trying which"
          which autoreconf
          bash scripts/build-desktop.sh

      - name: Build YMusic
        run: |
          ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageMsi :desktopApp:packageExe --no-daemon --stacktrace

      - name: Zip portable
        run: Compress-Archive -Path desktopApp\build\compose\binaries\main\app\* -DestinationPath YMusic-Portable-Windows.zip -Force

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Portable-Windows
          path: YMusic-Portable-Windows.zip

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-MSI
          path: desktopApp\build\compose\binaries\main\msi\*.msi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-EXE-Installer
          path: desktopApp\build\compose\binaries\main\exe\*.exe
