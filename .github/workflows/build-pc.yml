name: Build YMusic PC (MSI + EXE + Portable) - FIXED V4

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout YMusic
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MSYS2 with full build deps
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-setuptools
            yasm
            nasm
            mingw-w64-x86_64-autotools
            meson
            ninja

      - name: Force MinGW toolchain and verify Python
        shell: msys2 {0}
        env:
          PYTHONHOME: ""
          PYTHONPATH: ""
        run: |
          export MSYSTEM=MINGW64
          export PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:$PATH
          export PKG_CONFIG=/mingw64/bin/pkg-config
          export ACLOCAL_PATH=/mingw64/share/aclocal
          export CC=gcc
          export CXX=g++
          export PYTHON=/mingw64/bin/python3
          export PYTHON3=/mingw64/bin/python3
          hash -r

          echo "PATH=$PATH"
          echo "which python3 -> $(which python3)"
          echo "which python  -> $(which python)"
          python3 --version
          python --version
          python3 -c "import sys; print(sys.executable); print(sys.version)"

          test "$(readlink -f "$(which python3)")" = "/mingw64/bin/python3.exe" || {
            echo "::error::python3 is not the MinGW Python. PATH=$PATH"
            exit 1
          }

          ls -l /mingw64/bin/python* || true

      - name: Clone ffmpeg-build
        shell: bash
        run: |
          cd ..
          rm -rf ffmpeg-build
          git clone --recursive --shallow-submodules https://github.com/ymusic-io/ffmpeg-build ffmpeg-build

      - name: Build FFmpeg desktop with MinGW toolchain
        shell: msys2 {0}
        env:
          PYTHONHOME: ""
          PYTHONPATH: ""
        run: |
          export MSYSTEM=MINGW64
          export PATH=/mingw64/bin:/usr/local/bin:/usr/bin:/bin:$PATH
          export PKG_CONFIG=/mingw64/bin/pkg-config
          export ACLOCAL_PATH=/mingw64/share/aclocal
          export CC=gcc
          export CXX=g++
          export PYTHON=/mingw64/bin/python3
          export PYTHON3=/mingw64/bin/python3
          hash -r

          echo "PATH=$PATH"
          echo "python3 resolve:"
          which python3
          python3 --version
          python3 -c "import sys; print(sys.executable)"

          test "$(readlink -f "$(which python3)")" = "/mingw64/bin/python3.exe" || {
            echo "::error::The FFmpeg build is not using MinGW Python: $(which python3)"
            exit 1
          }

          cd ../ffmpeg-build
          echo "autoreconf version:"
          autoreconf --version || echo "autoreconf not in PATH"
          which autoreconf
          bash scripts/build-desktop.sh

      - name: Build YMusic
        shell: pwsh
        run: |
          ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageMsi :desktopApp:packageExe --no-daemon --stacktrace

      - name: Zip portable
        shell: pwsh
        run: |
          Compress-Archive -Path desktopApp\build\compose\binaries\main\app\* -DestinationPath YMusic-Portable-Windows.zip -Force

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Portable-Windows
          path: YMusic-Portable-Windows.zip

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-MSI
          path: desktopApp\build\compose\binaries\main\msi\*.msi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-EXE-Installer
          path: desktopApp\build\compose\binaries\main\exe\*.exe
