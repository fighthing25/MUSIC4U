
name: Build YMusic PC (MSI + EXE + Portable)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout YMusic
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout ffmpeg-build next to repo
        uses: actions/checkout@v4
        with:
          repository: ymusic-io/ffmpeg-build
          submodules: recursive
          path: ../ffmpeg-build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install WiX Toolset (for MSI/EXE)
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MSYS2 for bash (for ffmpeg build script)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain

      - name: Build FFmpeg desktop
        shell: msys2 {0}
        run: |
          cd ../ffmpeg-build
          bash scripts/build-desktop.sh

      - name: Build YMusic - Portable + MSI + EXE
        run: |
          ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageMsi :desktopApp:packageExe --no-daemon --stacktrace

      - name: Zip portable folder
        run: |
          Compress-Archive -Path desktopApp\build\compose\binaries\main\app\* -DestinationPath YMusic-Portable-Windows.zip -Force

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Portable-Windows
          path: YMusic-Portable-Windows.zip

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-MSI
          path: desktopApp\build\compose\binaries\main\msi\*.msi

      - name: Upload EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-EXE-Installer
          path: desktopApp\build\compose\binaries\main\exe\*.exe

      - name: Attach to Release (if release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YMusic-Portable-Windows.zip
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
