name: windows-build

# Dijalankan dengan tombol "Run workflow" di tab Actions (bukan otomatis).
# Langkah 1: membuat ffmpeg untuk Windows (lewat MSYS2, sesuai README ffmpeg-build).
# Langkah 2: membuat installer .msi YMusic, meniru job "macos" di release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      # Dua folder berdampingan (YMusicV4/ dan ffmpeg-build/), seperti di release.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ymusic-io/ffmpeg-build
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      # Hasil ffmpeg disimpan supaya percobaan berikutnya tidak membuatnya dari awal.
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/windows-x86_64
          key: ffmpeg-windows-x86_64-${{ hashFiles('ffmpeg-build/scripts/**', 'ffmpeg-build/patches/**') }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # MSYS2 MINGW64: lingkungan yang diminta README ffmpeg-build untuk Windows.
      # path-type inherit: Java, Node dan WiX dari Windows tetap terlihat di dalamnya.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git
            make
            patch
            diffutils
            autoconf
            automake
            libtool
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - name: Build ffmpeg for Windows
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffmpeg-build
        run: scripts/build-desktop.sh

      - name: Save ffmpeg build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/windows-x86_64
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Tanpa SECRETS_PASSPHRASE (kunci milik pemilik repo asli) build berjalan dengan
      # pengaturan bawaan: tanpa tanda tangan, tanpa layanan jarak jauh.
      - name: Package MSI
        shell: msys2 {0}
        working-directory: YMusicV4
        run: ./gradlew -Pproduction=true :desktopApp:packageReleaseMsi --stacktrace

      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-compose-logs
          path: YMusicV4/desktopApp/build/compose/logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msi
          path: YMusicV4/desktopApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
